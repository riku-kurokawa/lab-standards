[project]
name = "labkit"
version = "0.2.0"
description = "研究用計算プロジェクトの共通ライブラリ（データ保存・run管理・図テンプレート・規約チェック・文献管理）"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "h5py>=3.9",
  "pyarrow>=14",
  "matplotlib>=3.8",
  "jsonschema>=4.18",
  "pyyaml>=6",
]

[project.optional-dependencies]
polars = ["polars>=0.20"]
mlflow = ["mlflow>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
labkit = "labkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labkit"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["labkit"]
