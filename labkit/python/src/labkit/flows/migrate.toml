# 手順のチェックリスト: 既存プロジェクトを lab-standards に移行する（skill: migrate-project）
#   labkit flow start migrate → flow status → flow advance
# 各段階の done 条件を advance が機械的に検査する。操作の禁止はしない（取り返しのつかない操作は承認ゲートが別に守る）。
# approval = true の段階から進むには人間の承認（`labkit approve` か `labkit delegate flow`）が要る。

name = "migrate"
description = "既存プロジェクトを lab-standards の構造へ段階的に移行する"

[[stage]]
name = "freeze"
description = "すべてを commit してタグ pre-migration を打ち（承認ゲート）、git 管理外のデータを `labkit mirror push --to <写し先> --paths <dir...>` で写しておく"
done = [
  { type = "clean_tree" },
  { type = "git_tag", name = "pre-migration" },
  { type = "mirror" },
]

[[stage]]
name = "inventory"
description = "読み取りのみ。scratch/migration-inventory.csv（old_path, kind, new_path, size, note）を作り、人間の承認を待つ"
approval = true
done = [{ type = "csv", path = "scratch/migration-inventory.csv", columns = ["old_path", "kind", "new_path", "size", "note"] }]

[[stage]]
name = "apply-template"
description = "copier copy で雛形を適用し、lab.toml を mode=\"warn\" にして uv sync → labkit check の違反一覧を開発ログに記録する"
done = [
  { type = "file", path = "lab.toml" },
  { type = "file", path = ".copier-answers.yml" },
  { type = "lab_mode", value = "warn" },
]

[[stage]]
name = "raw-data"
description = "棚卸し表の raw を data/raw/ へ移し、`labkit raw freeze` で台帳に登録する（承認ゲート）"
done = [{ type = "manifest" }]

[[stage]]
name = "code"
description = "関数を src/ に切り出してテストを書く。入口を scripts/ に、パラメータを configs/ に。手を付けないものは legacy/ へ"
done = [{ type = "check", ignore = ["L050", "L002", "L003"] }]

[[stage]]
name = "reproduce"
description = "主要な結果を新パイプラインで再生成し旧結果と数値で比較、開発ログと ADR に残す。lab-reviewer のレビュー記録（pass）が必要"
done = [
  { type = "runs", min = 1 },
  { type = "review", stage = "reproduce" },
]

[[stage]]
name = "strict"
description = "lab.toml の mode を strict に戻し、labkit check が通ることを確認する"
done = [
  { type = "lab_mode", value = "strict" },
  { type = "check" },
]

[[stage]]
name = "done"
description = "移行完了"
done = []
