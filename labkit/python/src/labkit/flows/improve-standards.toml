# 手順の状態機械: プロジェクトから lab-standards 本体を改良し、リリースして取り込む（skill: improve-standards）
# 状態はプロジェクト側（.lab/flows/improve-standards.json）に置く。本体のチェックアウトは
# $LAB_STANDARDS_DEV か ~/dev/lab-standards（link 中は pyproject.toml の path）。

name = "improve-standards"
description = "lab-standards 本体を改良し、必要なら link で試し、リリースしてプロジェクトに取り込む"

[[stage]]
name = "triage"
description = "このプロジェクトだけの事情か、共通の改良かを振り分ける。改良の内容（何を・なぜ・どの部品か）を開発ログに書き、人間の承認を待つ"
approval = true
forbid = ["link", "template", "release", "raw"]
done = [
  { type = "devlog_today" },
]

[[stage]]
name = "branch"
description = "本体で feat/<名前> ブランチを切る（main で作業しない）"
forbid = ["link", "template", "release", "raw"]
done = [
  { type = "standards_branch", prefix = "feat/" },
]

[[stage]]
name = "implement"
description = "本体を直す（CLAUDE.md の規約）。labkit / LabKit.jl / 図テンプレート / check を変えるなら `uv run labkit standards link` でこのプロジェクトから試す（hooks・skills・雛形だけなら不要）。本体に commit を積む"
forbid = ["template", "release", "raw"]
done = [
  { type = "standards_ahead", min = 1 },
  { type = "linked_if_touched", paths = ["labkit/"] },   # 本体の labkit/ を変えたなら link していること
]

[[stage]]
name = "test"
description = "本体のテスト（labkit・hooks・Julia）を通し、lab-reviewer のレビュー記録（pass）を得る"
forbid = ["template", "release", "raw"]
done = [
  { type = "standards_tests" },
  { type = "review", stage = "test", repo = "standards" },   # 本体の HEAD に対する pass
]

[[stage]]
name = "release"
description = "CHANGELOG と tools/release.py X.Y.Z で版を揃え、人間の承認後に main へマージ・タグ・push（いずれも承認ゲート）"
approval = true
forbid = ["template", "raw"]
done = [
  { type = "standards_released" },
]

[[stage]]
name = "adopt"
description = "labkit standards unlink --to vX.Y.Z → commit → labkit standards template --ref vX.Y.Z → commit"
forbid = ["release", "raw"]
done = [
  { type = "linked", value = false },
  { type = "check", ignore = ["L021"] },
]

[[stage]]
name = "done"
description = "取り込み完了。他のプロジェクトは各自のタイミングで adopt と同じ手順を行う"
forbid = []
done = []
