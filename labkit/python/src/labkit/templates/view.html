<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フィード</title>
<style>
:root { --bg:#f4f3ef; --card:#fff; --ink:#1b1b19; --mute:#77756e; --line:#e3e1d9; --accent:#0b6e99; --soft:#eef5f8;
  --finding:#2e7d4f; --retract:#b3382c; --ask:#b26a00; --milestone:#5b4bb5; --code:#f3f1ea; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#201f1d; --ink:#edece7; --mute:#99978f; --line:#34332f;
  --accent:#6cb6d9; --soft:#1d2a30; --finding:#6fbf8e; --retract:#e58275; --ask:#e0a84f; --milestone:#a99cf0; --code:#2a2926; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 system-ui, "Yu Gothic UI", "Hiragino Sans", sans-serif; -webkit-text-size-adjust:100%; }
header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.bar { max-width:700px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; }
.bar h1 { font-size:16px; margin:0; white-space:nowrap; } .goal { flex:1; min-width:0; font-size:12.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tabs { display:flex; gap:4px; } .tabs button { font:inherit; font-size:13px; padding:3px 12px; border-radius:14px; border:1px solid transparent; background:none; color:var(--mute); cursor:pointer; white-space:nowrap; }
.tabs button.on { background:var(--card); border-color:var(--line); color:var(--ink); font-weight:600; }
main { max-width:700px; margin:0 auto; padding:8px 16px 80px; }
.day { text-align:center; font-size:12px; color:var(--mute); margin:22px 0 10px; }
.post { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px 14px; margin:0 0 14px; }
.head { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--mute); }
.tag { font-weight:600; font-size:12px; padding:0 9px; border-radius:10px; color:#fff; line-height:1.75; }
.tag.finding { background:var(--finding); } .tag.retract { background:var(--retract); } .tag.ask { background:var(--ask); } .tag.milestone { background:var(--milestone); }
@media (prefers-color-scheme: dark) { .tag { color:#161615; } }
.dot { width:8px; height:8px; border-radius:50%; background:var(--accent); margin-left:auto; } .seen { margin-left:auto; }
h2 { font-size:20px; line-height:1.45; margin:8px 0 6px; overflow-wrap:anywhere; letter-spacing:.01em; }
.body p { margin:0 0 8px; overflow-wrap:anywhere; } .body ul { margin:0 0 8px; padding-left:1.3em; } .body li { margin:2px 0; }
code { font:13px/1.4 ui-monospace, Consolas, monospace; background:var(--code); padding:1px 5px; border-radius:4px; }
.cite { display:inline-block; font-size:11px; line-height:1.5; color:var(--finding); border:1px solid currentColor; border-radius:8px; padding:0 5px; margin-left:3px; vertical-align:2px; cursor:help; }
figure { margin:12px 0 4px; } figure img { display:block; width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:zoom-in; }
figcaption { font-size:13.5px; margin-top:5px; } figcaption::before { content:"見るところ  "; color:var(--mute); font-size:11.5px; }
details { margin-top:8px; border-top:1px solid var(--line); padding-top:7px; } summary { cursor:pointer; font-size:13px; color:var(--mute); list-style-position:outside; }
summary:hover { color:var(--accent); } details .body { font-size:14.5px; margin-top:6px; }
pre { background:var(--code); border-radius:8px; padding:10px 12px; font:12.5px/1.5 ui-monospace, Consolas, monospace; overflow:auto; max-height:440px; margin:8px 0 0; }
.runs { font:12px/1.6 ui-monospace, Consolas, monospace; color:var(--mute); margin-top:6px; overflow-wrap:anywhere; }
.thread { margin-top:10px; } .msg { display:flex; gap:8px; margin-top:8px; font-size:14.5px; }
.who { flex:none; width:2.1em; height:2.1em; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:600; background:var(--soft); color:var(--accent); margin-top:1px; }
.msg.agent .who { background:var(--code); color:var(--mute); } .msg .t { font-size:11.5px; color:var(--mute); margin-left:6px; } .msg div { min-width:0; overflow-wrap:anywhere; }
.pending { font-size:12px; color:var(--mute); margin:4px 0 0 2.9em; }
.reply { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:flex-end; }
.reply textarea { flex:1 1 240px; font:inherit; font-size:14.5px; line-height:1.5; padding:7px 11px; height:38px; max-height:160px; resize:none; border:1px solid var(--line); border-radius:19px; background:var(--bg); color:var(--ink); outline:none; }
.reply textarea:focus { border-color:var(--accent); }
.btn { font:inherit; font-size:13.5px; height:38px; padding:0 15px; border-radius:19px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; white-space:nowrap; }
.btn:hover { border-color:var(--accent); color:var(--accent); } .btn.go { background:var(--accent); border-color:var(--accent); color:#fff; } .btn.go:hover { color:#fff; opacity:.9; }
.opts { display:flex; flex-direction:column; gap:6px; margin-top:12px; } .opts .btn { height:auto; min-height:38px; padding:7px 15px; text-align:left; white-space:normal; border-color:var(--ask); }
.empty { color:var(--mute); text-align:center; padding:70px 0; font-size:14.5px; } .empty b { display:block; color:var(--ink); font-size:16px; margin-bottom:6px; }
.foot { text-align:center; font-size:12px; color:var(--mute); margin-top:24px; }
#fresh { position:fixed; top:58px; left:50%; transform:translateX(-50%); z-index:6; display:none; box-shadow:0 2px 10px rgba(0,0,0,.18); }
#zoom { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:9; cursor:zoom-out; }
#zoom img { max-width:97vw; max-height:95vh; background:#fff; border-radius:6px; }
@media (max-width:560px) { .goal { display:none; } .bar h1 { flex:1; } .post { padding:14px 14px 12px; border-radius:12px; } h2 { font-size:18px; } }
</style>
</head>
<body>
<header><div class="bar"><h1 id="h1"></h1><div class="goal" id="goal"></div><div class="tabs" id="tabs"></div></div></header>
<button class="btn go" id="fresh">新しい投稿があります</button>
<main id="app"></main>
<div id="zoom"><img alt=""></div>
<script>
const S = /*STATE*/null;
const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let tab = "all";
const notesOf = p => S.notes["post:" + p.id] || [];
const unread = p => notesOf(p).length === 0;
const figSrc = f => S.fig_uris ? S.fig_uris[f.file] : "/fig/" + f.file;

function ago(iso) {
  const d = new Date(iso), s = (Date.now() - d) / 1000, hm = d.toTimeString().slice(0, 5);
  if (s < 90) return "たった今"; if (s < 3600) return Math.round(s / 60) + " 分前"; if (s < 6 * 3600) return Math.round(s / 3600) + " 時間前";
  return hm;
}
function dayLabel(iso) {
  const d = new Date(iso), t = new Date(); const diff = Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return diff === 0 ? "今日" : diff === 1 ? "昨日" : `${d.getMonth() + 1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;
}
// 本文: 段落・箇条書き・**強調**・`コード`・引用 [run:…]（投稿の時点で metrics.json と照合済み → ✓）
function inline(parent, text) {
  const re = /\*\*(.+?)\*\*|`([^`]+)`|\s*\[run:([^:\]\s]+):([^\]\s]+)\]/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parent.append(text.slice(last, m.index));
    if (m[1] != null) { const b = $("b"); inline(b, m[1]); parent.append(b); } else if (m[2] != null) parent.append($("code", "", m[2]));
    else { const c = $("span", "cite", "✓"); c.title = `run ${m[3]} の ${m[4]} と照合済み`; parent.append(c); }
    last = re.lastIndex;
  }
  if (last < text.length) parent.append(text.slice(last));
}
function prose(text) {
  const box = $("div", "body");
  for (const block of text.split(/\n\s*\n/)) {
    const lines = block.split("\n").filter(l => l.trim()); if (!lines.length) continue;
    if (lines.every(l => /^\s*[-・]\s+/.test(l))) { const ul = $("ul"); for (const l of lines) { const li = $("li"); inline(li, l.replace(/^\s*[-・]\s+/, "")); ul.append(li); } box.append(ul); }
    else { const p = $("p"); lines.forEach((l, k) => { if (k) p.append($("br")); inline(p, l); }); box.append(p); }
  }
  return box;
}
function fold(label, node) { const d = $("details"); d.append($("summary", "", label), node); return d; }
async function send(p, verdict, text) {
  const r = await fetch("/note", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target: "post:" + p.id, verdict, text }) });
  if (!r.ok) { alert("送れませんでした: " + await r.text()); return; }
  (S.notes["post:" + p.id] = notesOf(p)).push(await r.json()); stamp = null; draw();
}
function thread(p) {
  const box = $("div", "thread");
  for (const n of notesOf(p)) {
    const a = $("div", "msg"), body = $("div"); body.append(n.verdict === "ok" && !n.text ? "了解" : n.text, $("span", "t", ago(n.created)));
    a.append($("span", "who", "私"), body); box.append(a);
    if (n.reply) { const b = $("div", "msg agent"), rb = $("div"); rb.append(n.reply, $("span", "t", n.done ? ago(n.done) : "")); b.append($("span", "who", "AI"), rb); box.append(b); }
    else if (n.status === "open") box.append($("div", "pending", "次の拍でエージェントに届きます"));
  }
  return box;
}
function reply(p) {
  const wrap = $("div"); if (!S.writable) return wrap;
  const answered = notesOf(p).some(n => n.verdict === "choose");
  if (p.options && p.options.length && !answered) {
    const o = $("div", "opts"); for (const t of p.options) { const b = $("button", "btn", t); b.onclick = () => send(p, "choose", t); o.append(b); } wrap.append(o);
  }
  const box = $("div", "reply"), ta = $("textarea"); ta.rows = 1; ta.placeholder = "返信（Enter で送る。Shift+Enter で改行）";
  ta.oninput = () => { ta.style.height = "38px"; ta.style.height = Math.min(ta.scrollHeight + 2, 160) + "px"; };
  ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (ta.value.trim()) send(p, "comment", ta.value); } };
  box.append(ta);
  if (unread(p)) { const ok = $("button", "btn", "了解"); ok.title = "読んだ印。エージェントの対応は求めない"; ok.onclick = () => ta.value.trim() ? send(p, "comment", ta.value) : send(p, "ok", ""); box.append(ok); }
  wrap.append(box); return wrap;
}
function post(p) {
  const e = $("article", "post"), head = $("div", "head");
  const when = $("span", "", ago(p.created)); when.title = p.created.replace("T", " ").slice(0, 16);
  head.append($("span", "tag " + p.kind, S.kinds[p.kind] || p.kind), when, $("span", "", p.id));
  if (unread(p)) { const d = $("span", "dot"); d.title = "未読"; head.append(d); }
  e.append(head, $("h2", "", p.title), prose(p.body));
  for (const f of p.figs || []) {
    const src = figSrc(f); if (!src) continue;
    const fig = $("figure"), img = $("img"); img.src = src; img.loading = "lazy"; img.alt = f.caption;
    img.onclick = () => { const z = document.getElementById("zoom"); z.firstChild.src = src; z.style.display = "flex"; };
    const cap = $("figcaption"); inline(cap, f.caption); fig.append(img, cap); e.append(fig);
  }
  if (p.detail) e.append(fold("補足", prose(p.detail)));
  for (const c of p.code || []) e.append(fold("コード  " + c.label, $("pre", "", c.text)));
  if ((p.runs || []).length) e.append(fold(`根拠の run ${p.runs.length} 本`, $("div", "runs", p.runs.join("\n"))));
  e.append(thread(p), reply(p)); return e;
}
function draw() {
  document.title = S.project + " — フィード";
  document.getElementById("h1").textContent = S.project;
  document.getElementById("goal").textContent = S.goal || "";
  const nUnread = S.posts.filter(unread).length, tabs = document.getElementById("tabs"); tabs.textContent = "";
  for (const [k, label] of [["all", "すべて"], ["unread", "未読 " + nUnread]]) { const b = $("button", tab === k ? "on" : "", label); b.onclick = () => { tab = k; draw(); window.scrollTo(0, 0); }; tabs.append(b); }
  const app = document.getElementById("app"); app.textContent = "";
  const list = tab === "unread" ? S.posts.filter(unread) : S.posts;
  if (!list.length) { const m = $("div", "empty"); m.append($("b", "", tab === "unread" ? "すべて読みました" : "まだ投稿はありません"), tab === "unread" ? "" : "エージェントが伝える価値があると判断したことだけが、ここに届きます。"); app.append(m); }
  let day = "";
  for (const p of list) { const d = dayLabel(p.created); if (d !== day) { app.append($("div", "day", d)); day = d; } app.append(post(p)); }
  if (S.older || !S.writable) app.append($("div", "foot", (S.older ? `これより前の投稿 ${S.older} 件（labkit view --days で期間を延ばす）` : "") + (S.writable ? "" : `  ${S.generated} に書き出し（返信は labkit view で）`)));
}
document.getElementById("zoom").onclick = e => { e.currentTarget.style.display = "none"; };
// 新しい投稿・エージェントの答えが来たら知らせる（書きかけの返信が無ければ、そのまま読み込み直す）
let stamp = S.stamp;
if (S.writable) setInterval(async () => {
  try {
    const now = await (await fetch("/stamp")).text(); if (stamp === null) { stamp = now; return; } if (now === stamp) return;
    const typing = [...document.querySelectorAll("textarea")].some(t => t.value.trim());
    if (!typing && window.scrollY < 200) location.reload(); else document.getElementById("fresh").style.display = "block";
  } catch (e) {}
}, 15000);
document.getElementById("fresh").onclick = () => location.reload();
draw();
</script>
</body>
</html>
