# lab-standards プロジェクト雛形（copier）
#   新規:   copier copy gh:<you>/lab-standards myproj
#   追従:   cd myproj && copier update
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_min_copier_version: "9.0.0"
_exclude:
  - "{% if not use_julia %}jl{% endif %}"
# 生成後はプロジェクトのもの（種として置くだけ）: copier update で既存ファイルは触らない（消していれば再生成される）。
# 例のコード・設定・figspec・ジョブ・手元パスも種（研究者が自分のものに書き換える前提。雛形側の変更で衝突させない）。
# 管理対象として更新を受けるのは規約の器: lab.toml, Makefile, pyproject.toml, jl/Project.toml, CLAUDE.md, .claude/settings.json,
# .pre-commit-config.yaml, .gitignore, 各ディレクトリの README
# 注意: ここに Jinja（{{ package_name }} 等）は使わない。copier update では答えが読まれる前にパターンが評価・キャッシュされ、効かない（copier 9.19 で確認）。
_skip_if_exists:
  - README.md
  - docs/data-dictionary.md
  - docs/decisions/0001-adopt-lab-standards.md
  - literature/references.bib
  - literature/tags.toml
  - data/raw/MANIFEST.sha256
  - configs/base.toml
  - configs/experiments/example.toml
  - configs/paths/local.toml
  - figspecs/example_*.toml
  - scripts/run_example.py
  - jobs/slurm_example.sh
  - src/*/__init__.py
  - src/*/filters.py
  - tests/test_filters.py
  - jl/src/*.jl
  - jl/scripts/run_example.jl
  - jl/test/runtests.jl

project_name:
  type: str
  help: プロジェクト名（例：EEG artifact removal）

project_slug:
  type: str
  help: 識別子（小文字英数とアンダースコア）
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: "{% if not (project_slug | regex_search('^[a-z][a-z0-9_]*$')) %}小文字英数と _ のみ{% endif %}"

package_name:
  type: str
  help: Python パッケージ名（src/<package_name>）
  default: "{{ project_slug }}"

julia_module:
  type: str
  help: Julia モジュール名（CamelCase）
  default: "{{ project_slug.split('_') | map('capitalize') | join }}"

author:
  type: str
  help: 著者名

use_julia:
  type: bool
  help: Julia も使いますか
  default: true

python_version:
  type: str
  default: "3.12"

standards_repo:
  type: str
  help: lab-standards の GitHub リポジトリ（owner/name）
  default: "riku-kurokawa/lab-standards"

standards_ref:
  type: str
  help: 使う lab-standards のタグ（再現性のため固定）
  default: "v0.4.0"